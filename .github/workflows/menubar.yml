name: Menubar App

on:
  push:
    branches: [main]
    paths:
      - 'menubar/**'
      - '.github/workflows/menubar.yml'
  pull_request:
    branches: [main]
    paths:
      - 'menubar/**'
      - '.github/workflows/menubar.yml'

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        working-directory: menubar/GroveMenubar
        run: swift build -c release

      - name: Run tests
        working-directory: menubar/GroveMenubar
        run: swift test
