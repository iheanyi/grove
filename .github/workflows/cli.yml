name: CLI

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/cli.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/cli.yml'

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.21', '1.22']

    steps:
      - uses: actions/checkout@v4

      - name: Guard committed dashboard embed
        run: |
          set -euo pipefail
          if git ls-files -- 'cli/internal/dashboard/web/build/**' | grep -q .; then
            echo "error: generated web/build must not be tracked in git" >&2
            git ls-files -- 'cli/internal/dashboard/web/build/**'
            exit 1
          fi
          hashed="$(git ls-files -- 'cli/internal/dashboard/web' | grep -E '\.[A-Za-z0-9_-]{8}\.(js|css)$' || true)"
          if [ -n "$hashed" ]; then
            echo "error: hashed Vite assets must not be tracked in git" >&2
            printf '%s\n' "$hashed"
            exit 1
          fi
          stub="cli/internal/dashboard/web/stub/index.html"
          if ! grep -q 'data-grove-embed="stub"' "$stub"; then
            echo "error: $stub must contain data-grove-embed=\"stub\"" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cli/internal/dashboard/web/package-lock.json

      - name: Build web assets
        working-directory: cli/internal/dashboard/web
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: cli/go.sum

      - name: Download dependencies
        working-directory: cli
        run: go mod download

      - name: Run tests
        working-directory: cli
        run: go test -tags embedui -v -race -coverprofile=coverage.txt -covermode=atomic ./

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.22'
        with:
          file: cli/coverage.txt
          flags: cli

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard committed dashboard embed
        run: |
          set -euo pipefail
          if git ls-files -- 'cli/internal/dashboard/web/build/**' | grep -q .; then
            echo "error: generated web/build must not be tracked in git" >&2
            git ls-files -- 'cli/internal/dashboard/web/build/**'
            exit 1
          fi
          hashed="$(git ls-files -- 'cli/internal/dashboard/web' | grep -E '\.[A-Za-z0-9_-]{8}\.(js|css)$' || true)"
          if [ -n "$hashed" ]; then
            echo "error: hashed Vite assets must not be tracked in git" >&2
            printf '%s\n' "$hashed"
            exit 1
          fi
          stub="cli/internal/dashboard/web/stub/index.html"
          if ! grep -q 'data-grove-embed="stub"' "$stub"; then
            echo "error: $stub must contain data-grove-embed=\"stub\"" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cli/internal/dashboard/web/package-lock.json

      - name: Build web assets
        working-directory: cli/internal/dashboard/web
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cli/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: cli
          args: --build-tags embedui

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Guard committed dashboard embed
        run: |
          set -euo pipefail
          if git ls-files -- 'cli/internal/dashboard/web/build/**' | grep -q .; then
            echo "error: generated web/build must not be tracked in git" >&2
            git ls-files -- 'cli/internal/dashboard/web/build/**'
            exit 1
          fi
          hashed="$(git ls-files -- 'cli/internal/dashboard/web' | grep -E '\.[A-Za-z0-9_-]{8}\.(js|css)$' || true)"
          if [ -n "$hashed" ]; then
            echo "error: hashed Vite assets must not be tracked in git" >&2
            printf '%s\n' "$hashed"
            exit 1
          fi
          stub="cli/internal/dashboard/web/stub/index.html"
          if ! grep -q 'data-grove-embed="stub"' "$stub"; then
            echo "error: $stub must contain data-grove-embed=\"stub\"" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cli/internal/dashboard/web/package-lock.json

      - name: Build web assets
        working-directory: cli/internal/dashboard/web
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cli/go.sum

      - name: Build
        working-directory: cli
        run: go build -tags embedui -v -o grove ./cmd/grove

      - name: Verify binary
        working-directory: cli
        run: ./grove version
