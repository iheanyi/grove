<!DOCTYPE html>
<html lang="en" data-grove-embed="stub">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Grove</title>
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #0f172a;
			color: #e2e8f0;
			font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
			line-height: 1.5;
		}
		main {
			max-width: 36rem;
			padding: 2rem;
		}
		h1 {
			margin: 0 0 0.75rem;
			font-size: 1.75rem;
			font-weight: 650;
			letter-spacing: -0.02em;
			color: #22c55e;
		}
		p {
			margin: 0 0 1rem;
			color: #cbd5e1;
		}
		code {
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			font-size: 0.9em;
			background: #1e293b;
			color: #bbf7d0;
			padding: 0.15em 0.4em;
			border-radius: 0.25rem;
		}
		a {
			color: #22c55e;
		}
	</style>
</head>
<body>
	<main>
		<h1>Grove</h1>
		<p>
			This <code>go install</code> binary does not include the full dashboard.
			GitHub release and Homebrew binaries do.
		</p>
		<p>
			Locally run <code>make build</code> (or <code>npm run build</code> in this
			directory, then <code>go build -tags embedui</code>).
		</p>
		<p>
			<a href="https://github.com/iheanyi/grove/releases">Download a release</a>
		</p>
	</main>
</body>
</html>
