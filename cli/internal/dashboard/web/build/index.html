<!DOCTYPE html>
<html lang="en" data-grove-embed="stub">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grove</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 36rem;
      padding: 2rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      color: #22c55e;
      font-size: 1.75rem;
      font-weight: 650;
    }
    p { margin: 0 0 1rem; }
    a { color: #22c55e; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #1e293b;
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Grove</h1>
    <p>This binary was not packaged with the full dashboard. GitHub Releases and Homebrew include it.</p>
    <p>To build the complete UI locally, run <code>make build</code> from <code>cli/</code>.</p>
    <p><a href="https://github.com/iheanyi/grove/releases">Download a release</a></p>
  </main>
</body>
</html>
